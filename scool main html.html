<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Discord Clone (Serverless)</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#313338;--sidebar:#1e1f22;--panel:#2b2d31;
  --text:#dbdee1;--muted:#949ba4;--accent:#5865f2;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;font-family:Arial;background:var(--bg);color:var(--text)}
#servers{width:72px;background:var(--sidebar);padding:10px}
.server{width:48px;height:48px;border-radius:50%;background:var(--accent);margin-bottom:10px}
#channels{width:240px;background:var(--panel);padding:10px}
.channel{padding:6px;color:var(--muted);cursor:pointer}
.channel.active{background:#3f4147;color:white;border-radius:4px}
#chat{flex:1;display:flex;flex-direction:column}
#header{height:48px;background:var(--panel);display:flex;align-items:center;padding:10px}
#messages{flex:1;padding:10px;overflow-y:auto}
.msg{margin-bottom:8px}
.user{font-weight:bold;margin-right:5px}
#input{padding:10px;background:var(--panel)}
#input input{width:100%;padding:10px;border:none;border-radius:8px;background:#383a40;color:white}
#right{width:240px;background:var(--panel);padding:10px}
button{background:var(--accent);border:none;color:white;padding:6px;border-radius:5px;cursor:pointer;margin-top:5px}
input{width:100%;padding:6px;margin-top:5px;border-radius:5px;border:none}
video{width:100%;border-radius:6px;background:black;margin-top:5px}
</style>
</head>
<body>

<!-- SERVERS -->
<div id="servers"><div class="server"></div></div>

<!-- CHANNELS -->
<div id="channels">
  <h4>CHANNELS</h4>
  <div id="channelList"></div>
  <input id="newChannel" placeholder="new-channel">
  <button onclick="addChannel()">Add</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header"># <span id="channelName"></span></div>
  <div id="messages"></div>
  <div id="input">
    <input id="msg" placeholder="Message" />
  </div>
</div>

<!-- FRIENDS & VIDEO -->
<div id="right">
  <h4>You</h4>
  <b id="myName"></b>

  <h4>Call</h4>
  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>
</div>

<script>
// -------- USERNAME (SHORT ID) --------
const username = prompt("Choose a username (short ID):");
document.getElementById("myName").innerText = username;

// -------- CHANNELS --------
let channels = ["general"];
let currentChannel = "general";

function renderChannels(){
  channelList.innerHTML="";
  channels.forEach(c=>{
    const d=document.createElement("div");
    d.className="channel"+(c===currentChannel?" active":"");
    d.innerText="# "+c;
    d.onclick=()=>{switchChannel(c)};
    channelList.appendChild(d);
  });
  channelName.innerText=currentChannel;
}
function addChannel(){
  const c=newChannel.value.trim();
  if(c&&!channels.includes(c)){channels.push(c);newChannel.value="";renderChannels()}
}
function switchChannel(c){
  currentChannel=c;
  messages.innerHTML="";
  renderChannels();
}

// -------- PEER --------
const peer = new Peer(username);
let peers = {}; // all connected users

peer.on("connection", conn=>{
  peers[conn.peer]=conn;
  conn.on("data",handleData);
});

function broadcast(data){
  Object.values(peers).forEach(c=>c.send(data));
}

// -------- CHAT --------
msg.addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()});
function sendMsg(){
  if(!msg.value)return;
  addMsg(username,msg.value);
  broadcast({type:"msg",channel:currentChannel,user:username,text:msg.value});
  msg.value="";
}
function addMsg(u,t){
  const d=document.createElement("div");
  d.className="msg";
  d.innerHTML=`<span class="user">${u}</span>${t}`;
  messages.appendChild(d);
  messages.scrollTop=messages.scrollHeight;
}

// -------- RECEIVE --------
function handleData(d){
  if(d.type==="msg"&&d.channel===currentChannel){
    addMsg(d.user,d.text);
  }
}

// -------- AUTO CONNECT --------
// Connect to anyone new in same “channel” (simplified serverless trick)
let knownPeers = [];
function promptPeers(){
  const p = prompt("Enter comma-separated usernames to connect to (optional, can leave blank)");
  if(!p)return;
  p.split(",").map(x=>x.trim()).forEach(name=>{
    if(name&&name!==username&&!peers[name]){
      const c = peer.connect(name);
      c.on("open",()=>{peers[name]=c});
      c.on("data",handleData);
    }
  });
}
setTimeout(promptPeers, 1000);

// -------- CALL --------
async function callUser(name){
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  local.srcObject = stream;
  if(peers[name]) peers[name].send({type:"call",from:username});
  const call = peer.call(name, stream);
  call.on("stream", s=>remote.srcObject = s);
}
peer.on("call", async call=>{
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  local.srcObject = stream;
  call.answer(stream);
  call.on("stream", s=>remote.srcObject = s);
});

renderChannels();
</script>
</body>
</html>
